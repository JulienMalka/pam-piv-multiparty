[package]
name = "piv-multiparty"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "EUPL-1.2"
description = "PAM module enforcing multi-party PIV authentication using slot-9a SPKI as per-device identity"
repository = "https://github.com/julienmalka/piv-multiparty"
homepage = "https://github.com/julienmalka/piv-multiparty"
authors = ["Julien Malka <julien@malka.sh>"]
keywords = ["pam", "piv", "smartcard", "pkcs11", "authentication"]
categories = ["authentication", "cryptography"]

[lib]
name = "pam_piv_multiparty"
crate-type = ["cdylib", "rlib"]

[dependencies]
pam-bindings = "0.1"
thiserror = "1"
base64 = "0.22"
log = "0.4"
syslog = "7"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
sha2 = "0.10"
rand = "0.8"
zeroize = "1"
cryptoki = "0.12"
hex = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
